services:
  app:
    container_name: classtrack
    image: classtrack-dev
    restart: unless-stopped
    build:
      dockerfile: Dockerfile
      context: .
      target: development
    env_file:
      - .env
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    networks:
      - app-network
    depends_on:
      - db
    command: sh -c "npx prisma generate && npm run start:dev"

  db:
    container_name: classtrack-db
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  pgdata:

  node_modules:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./node_modules # Bind mount node_modules to your host's directory

networks:
  app-network:
    name: app-network
    driver: bridge

services:
  app:
    build:
      context: .
      target: development
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    networks:
      - app-network
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - app-network

volumes:
  pgdata:

  node_modules:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./node_modules # Bind mount node_modules to your host's directory

networks:
  app-network:
    name: app-network
    driver: bridge
